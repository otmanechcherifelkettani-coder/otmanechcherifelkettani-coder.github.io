<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HESTIM · Inbox</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#14171c;--muted:#6b7280;--line:#e5e7eb;--accent:#0b4f9c;--accent-ink:#fff;
--ai:#e7f0fb;--ai-ink:#0b4f9c;--human:#fdf1e3;--human-ink:#9a4d00;--in:#f1f2f4;--out:#dbe9fb;--danger:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#171a20;--ink:#e8eaed;--muted:#9aa1ac;--line:#2a2f38;--accent:#5b9cf0;--accent-ink:#0b0d10;
--ai:#16263b;--ai-ink:#8bbcf5;--human:#3a2a17;--human-ink:#f3b46b;--in:#20242c;--out:#1b3150;--danger:#f97066}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header b{font-size:15px}nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--muted);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--ai);color:var(--ai-ink);font-weight:600}
main{height:calc(100vh - 49px)}.view{display:none;height:100%}.view.on{display:flex}
.list{width:340px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0}
.filters{padding:10px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.filters input{flex:1 1 100%}
.items{overflow:auto;flex:1}.item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover,.item.sel{background:var(--bg)}.item .top{display:flex;justify-content:space-between;gap:8px}
.item .txt{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;white-space:nowrap}.b-ai{background:var(--ai);color:var(--ai-ink)}.b-human{background:var(--human);color:var(--human-ink)}
.b-esc{background:var(--danger);color:#fff}.b-st{border:1px solid var(--line);color:var(--muted)}
.pane{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar .grow{flex:1}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:72%;padding:8px 11px;border-radius:10px;white-space:pre-wrap;word-wrap:break-word}
.m.in{background:var(--in);align-self:flex-start}.m.out{background:var(--out);align-self:flex-end}
.m small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.compose{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel)}.compose textarea{flex:1;resize:none;height:44px}
.side{width:280px;border-left:1px solid var(--line);background:var(--panel);padding:14px;overflow:auto}
.side h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}.kv{display:grid;grid-template-columns:96px 1fr;gap:3px 8px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}.esc{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:6px;font-size:13px}
.empty{margin:auto;color:var(--muted)}
.wrap{flex:1;overflow:auto;padding:16px}.cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:130px}.card b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.card span{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:13px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}
.ask{display:flex;gap:8px;margin-bottom:10px}.ask input{flex:1}.hint{color:var(--muted);margin:0 0 12px}
@media (max-width:820px){.side{display:none}.list{width:100%}.view.on.has-sel .list{display:none}.m{max-width:88%}}
</style>
</head>
<body>
<header><b>HESTIM · Agent</b>
<nav><button data-v="conv" class="on">Conversations</button><button data-v="contacts">Contacts</button><button data-v="esc">Escalades</button><button data-v="test">Tester l'agent</button></nav>
</header>
<main>
<section class="view on" id="v-conv">
  <div class="list">
    <div class="filters">
      <input id="q" placeholder="Rechercher un nom, numéro, message…">
      <select id="fh"><option value="">Tous</option><option value="ai">Gérées par l'IA</option><option value="human">Gérées par l'équipe</option></select>
      <select id="fs"><option value="">Tous statuts</option><option>ready</option><option>undecided</option><option>general</option><option>new</option><option>enrolled</option><option>not_fit</option></select>
    </div>
    <div class="items" id="convs"></div>
  </div>
  <div class="pane" id="pane"><div class="empty">Sélectionnez une conversation</div></div>
  <aside class="side" id="side"></aside>
</section>

<section class="view" id="v-contacts"><div class="wrap">
  <div class="ask"><input id="askq" placeholder="Demandez à l'IA : « prospects prêts intéressés par l'ingénierie à Casablanca »"><button class="btn primary" id="askb">Demander</button></div>
  <p class="hint" id="askx"></p>
  <div class="cards" id="cards"></div>
  <div class="filters" style="padding:0 0 10px;border:0">
    <select id="cc"><option value="">Tous canaux</option><option>whatsapp</option><option>instagram</option><option>web</option></select>
    <select id="ck"><option value="">Tous types</option><option>prospect</option><option>parent</option><option>student</option><option>unknown</option></select>
    <select id="cs"><option value="">Tous statuts</option><option>ready</option><option>undecided</option><option>general</option><option>new</option><option>enrolled</option><option>not_fit</option></select>
    <a class="btn" href="/api/contacts/export.csv">Exporter CSV</a>
  </div>
  <table><thead><tr><th>Nom</th><th>Canal</th><th>Type</th><th>Statut</th><th>Programme</th><th>Niveau</th><th>Ville</th></tr></thead><tbody id="ctab"></tbody></table>
</div></section>

<section class="view" id="v-esc"><div class="wrap"><table><thead><tr><th>Catégorie</th><th>Résumé</th><th>Conversation</th><th></th></tr></thead><tbody id="etab"></tbody></table></div></section>

<section class="view" id="v-test"><div class="pane">
  <div class="bar"><span class="grow">Simulez un contact (canal « web ») : français, darija, arabe, anglais…</span><button class="btn" id="tnew">Nouveau contact</button></div>
  <div class="msgs" id="tmsgs"></div>
  <div class="compose"><textarea id="tin" placeholder="Salam, chhal les frais dyal l'ingénierie ?"></textarea><button class="btn primary" id="tsend">Envoyer</button></div>
</div></section>
</main>
<script>
const $=s=>document.querySelector(s), esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,o={})=>{const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw new Error(await r.text());return r.json()};
const ago=t=>{if(!t)return'';const s=Date.now()/1000-t;return s<60?'à l\'instant':s<3600?Math.floor(s/60)+' min':s<86400?Math.floor(s/3600)+' h':Math.floor(s/86400)+' j'};
const hb=h=>h==='ai'?'<span class="badge b-ai">IA</span>':'<span class="badge b-human">Équipe</span>';
let sel=null;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));({contacts:loadContacts,esc:loadEsc,conv:loadConvs})[b.dataset.v]?.()});

async function loadConvs(){const p=new URLSearchParams();if($('#q').value)p.set('q',$('#q').value);if($('#fh').value)p.set('handler',$('#fh').value);if($('#fs').value)p.set('lead_status',$('#fs').value);
  const rows=await api('/api/conversations?'+p);
  $('#convs').innerHTML=rows.map(r=>`<div class="item ${r.id===sel?'sel':''}" data-id="${r.id}"><div class="top"><b>${esc(r.name||r.external_id)}</b><span>${hb(r.handler)} ${r.open_escalations?'<span class="badge b-esc">'+r.open_escalations+'</span>':''}</span></div>
  <div class="top"><span class="txt">${esc(r.last_text)}</span><span class="badge b-st">${esc(r.lead_status)}</span></div><small style="color:var(--muted)">${esc(r.channel)} · ${ago(r.updated_at)}${r.assignee?' · '+esc(r.assignee):''}</small></div>`).join('')||'<p class="empty" style="padding:16px">Aucune conversation</p>';
  document.querySelectorAll('.item').forEach(i=>i.onclick=()=>openConv(+i.dataset.id));}
let t;['#q','#fh','#fs'].forEach(s=>$(s).addEventListener('input',()=>{clearTimeout(t);t=setTimeout(loadConvs,250)}));

async function openConv(id){sel=id;$('#v-conv').classList.add('has-sel');const d=await api('/api/conversations/'+id),c=d.conversation,ct=d.contact;
  $('#pane').innerHTML=`<div class="bar"><button class="btn" id="back" style="display:none">←</button><b class="grow">${esc(ct.name||ct.external_id)} ${hb(c.handler)}</b>
   <input id="asg" placeholder="Attribuer à…" value="${esc(c.assignee)}" style="width:140px"><button class="btn" id="asgb">Attribuer</button>
   ${c.handler==='ai'?'<button class="btn primary" id="tk">Prendre le contrôle</button>':'<button class="btn" id="rl">Rendre à l\'IA</button>'}<button class="btn" id="cl">Clôturer</button></div>
   <div class="msgs" id="msgs">${d.messages.map(m=>`<div class="m ${m.direction}">${esc(m.text)}<small>${esc(m.author==='contact'?'':m.author==='ai'?'IA':m.author)} ${ago(m.created_at)}</small></div>`).join('')}</div>
   <div class="compose"><textarea id="rep" placeholder="${c.handler==='ai'?'Répondre vous-même désactive l\'autopilote…':'Votre réponse…'}"></textarea><button class="btn primary" id="send">Envoyer</button></div>`;
  $('#msgs').scrollTop=1e9;if(matchMedia('(max-width:820px)').matches)$('#back').style.display='';
  $('#back').onclick=()=>{$('#v-conv').classList.remove('has-sel')};
  $('#asgb').onclick=async()=>{await api(`/api/conversations/${id}/assign`,{method:'POST',body:JSON.stringify({assignee:$('#asg').value})});loadConvs()};
  $('#tk')&&($('#tk').onclick=async()=>{await api(`/api/conversations/${id}/takeover`,{method:'POST'});openConv(id);loadConvs()});
  $('#rl')&&($('#rl').onclick=async()=>{await api(`/api/conversations/${id}/release`,{method:'POST'});openConv(id);loadConvs()});
  $('#cl').onclick=async()=>{await api(`/api/conversations/${id}/close`,{method:'POST'});loadConvs()};
  $('#send').onclick=async()=>{const v=$('#rep').value.trim();if(!v)return;await api(`/api/conversations/${id}/reply`,{method:'POST',body:JSON.stringify({text:v})});openConv(id);loadConvs()};
  $('#side').innerHTML=`<h4>Fiche contact</h4><div class="kv">${[['Canal',ct.channel],['Identifiant',ct.external_id],['Type',ct.kind],['Statut',ct.lead_status],['Langue',ct.language],['Programme',ct.program_interest],['Niveau',ct.level],['Rentrée',ct.intake],['Ville',ct.city],['Abonné',ct.subscribed?'oui':'non']].map(([k,v])=>`<span>${k}</span><span>${esc(v)||'—'}</span>`).join('')}</div>
   <h4>Notes de l'IA</h4><div style="white-space:pre-wrap;font-size:13px">${esc(ct.notes)||'—'}</div>
   <h4>Escalades</h4>${d.escalations.map(e=>`<div class="esc"><b>${esc(e.category)}</b>${e.resolved?' · résolue':''}<br>${esc(e.summary)}</div>`).join('')||'—'}`;
  loadConvs();}

async function loadContacts(rows){const s=await api('/api/contacts/stats');const tot=s.by_channel.reduce((a,c)=>a+c.total,0),sub=s.by_channel.reduce((a,c)=>a+(c.subscribed||0),0);
  $('#cards').innerHTML=[['Contacts',tot],['Abonnés',sub],['Désabonnés',tot-sub],...s.by_channel.map(c=>[c.channel,c.total]),['Prêts (ready)',s.by_lead_status.ready||0],['Indécis',s.by_lead_status.undecided||0]].map(([k,v])=>`<div class="card"><b>${v}</b><span>${esc(k)}</span></div>`).join('');
  if(!rows){const p=new URLSearchParams();[['channel','#cc'],['kind','#ck'],['lead_status','#cs']].forEach(([k,s])=>$(s).value&&p.set(k,$(s).value));rows=await api('/api/contacts?'+p)}
  $('#ctab').innerHTML=rows.map(r=>`<tr><td>${esc(r.name||r.external_id)}</td><td>${esc(r.channel)}</td><td>${esc(r.kind)}</td><td>${esc(r.lead_status)}</td><td>${esc(r.program_interest)}</td><td>${esc(r.level)}</td><td>${esc(r.city)}</td></tr>`).join('')||'<tr><td colspan="7">Aucun contact</td></tr>';}
['#cc','#ck','#cs'].forEach(s=>$(s).onchange=()=>{$('#askx').textContent='';loadContacts()});
$('#askb').onclick=async()=>{$('#askx').textContent='…';try{const r=await api('/api/contacts/ask',{method:'POST',body:JSON.stringify({question:$('#askq').value})});$('#askx').textContent=r.explanation+' — '+r.contacts.length+' contact(s)';loadContacts(r.contacts)}catch(e){$('#askx').textContent='Erreur : '+e.message}};

async function loadEsc(){const rows=await api('/api/escalations');$('#etab').innerHTML=rows.map(e=>`<tr><td><span class="badge ${e.category==='urgent'?'b-esc':'b-st'}">${esc(e.category)}</span></td><td>${esc(e.summary)}</td><td><a href="#" data-c="${e.conversation_id}">Ouvrir</a></td><td><button class="btn" data-r="${e.id}">Résolue</button></td></tr>`).join('')||'<tr><td colspan="4">Aucune escalade ouverte</td></tr>';
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{await api(`/api/escalations/${b.dataset.r}/resolve`,{method:'POST'});loadEsc()});
  document.querySelectorAll('[data-c]').forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelector('nav button[data-v=conv]').click();openConv(+a.dataset.c)});}

let tid='test-'+Math.random().toString(36).slice(2,8);
const tadd=(cls,txt)=>{$('#tmsgs').insertAdjacentHTML('beforeend',`<div class="m ${cls}">${esc(txt)}</div>`);$('#tmsgs').scrollTop=1e9};
$('#tnew').onclick=()=>{tid='test-'+Math.random().toString(36).slice(2,8);$('#tmsgs').innerHTML=''};
$('#tsend').onclick=async()=>{const v=$('#tin').value.trim();if(!v)return;$('#tin').value='';tadd('in',v);tadd('out','…');
  try{const r=await api('/api/chat',{method:'POST',body:JSON.stringify({external_id:tid,text:v})});$('#tmsgs').lastChild.textContent=r.reply||'(conversation transférée à l\'équipe — pas de réponse IA)'}catch(e){$('#tmsgs').lastChild.textContent='Erreur : '+e.message}};
$('#tin').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#tsend').click()}});
loadConvs();setInterval(()=>{if($('#v-conv').classList.contains('on'))loadConvs()},10000);
</script>
</body>
</html>
