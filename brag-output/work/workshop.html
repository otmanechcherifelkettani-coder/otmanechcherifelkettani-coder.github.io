<!doctype html>
<html><head><meta charset="utf-8"><title>Launching AI Agents</title>
<style>
@font-face { font-family:"IDisp"; src: local("Inter Display ExtraBold"), local("InterDisplay-ExtraBold"); font-weight:800; }
@font-face { font-family:"IDisp"; src: local("Inter Display Bold"), local("InterDisplay-Bold"); font-weight:700; }

:root { --paper:#F5F1E8; --cob:#2346FF; --org:#FF5B1F; --yel:#FFC531; --navy:#0E1A3D; --sky:#DCE3FF; --line:rgba(14,26,61,.14); }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { overflow:hidden; background:var(--paper); }
#stage { position:relative; overflow:hidden; color:var(--navy); font-family:"Inter",sans-serif; -webkit-font-smoothing:antialiased; }
canvas { position:absolute; inset:0; }
.a { position:absolute; will-change:transform,opacity; }
.mono { font-family:"JetBrains Mono",monospace; font-weight:600; letter-spacing:.12em; text-transform:uppercase; }
.code { font-family:"JetBrains Mono",monospace; font-weight:500; }
.hl { position:absolute; font-family:"IDisp",sans-serif; font-weight:800; letter-spacing:-.035em; line-height:1.04; }
.hl .w { display:inline-block; overflow:hidden; vertical-align:top; padding:0 .02em .1em; margin:0 -.02em -.1em; }
.hl .w > span { display:inline-block; will-change:transform; }
.mk { background:var(--yel); color:var(--navy); padding:0 .12em; border-radius:.12em; }
.c-cob { color:var(--cob); } .c-org { color:var(--org); } .c-yel { color:var(--yel); } .c-white { color:#fff; }
.ag { position:absolute; border-radius:28%; }
.ag .e { position:absolute; top:34%; width:17%; height:26%; background:#fff; border-radius:50%; overflow:hidden; }
.ag .e.l { left:25%; } .ag .e.r { right:25%; }
.ag .e i { position:absolute; left:28%; top:34%; width:46%; height:46%; background:var(--navy); border-radius:50%; display:block; }
.bub { position:absolute; padding:12px 20px; border-radius:22px; font-family:IDisp; font-weight:700; font-size:28px; white-space:nowrap; background:#fff; box-shadow:0 8px 0 rgba(14,26,61,.08); }
.chip { position:absolute; height:58px; border-radius:16px; display:flex; align-items:center; gap:12px; padding:0 18px; background:#fff; border:2px solid var(--navy); font-size:22px; white-space:nowrap; }
.chip svg, .ic svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.card { position:absolute; border-radius:28px; overflow:hidden; }
.tile { position:absolute; width:400px; height:460px; border-radius:26px; background:#fff; border:2px solid var(--navy); overflow:hidden; }
.tile .hd { height:64px; display:flex; align-items:center; padding:0 22px; gap:12px; font-size:15px; }
.tile .face { position:absolute; inset:0; }
.tile .bd { position:absolute; left:0; right:0; top:64px; bottom:0; }
.pill { display:inline-block; border-radius:999px; padding:10px 22px; }
.row { position:absolute; left:22px; right:22px; height:44px; display:flex; align-items:center; border-bottom:1.5px solid var(--line); font-size:18px; white-space:nowrap; }
.row .id { width:48px; font-size:13px; color:#6b7390; }
.row .s { margin-left:auto; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; font-weight:800; }
.dl { position:absolute; border-radius:24px; padding:26px; display:flex; flex-direction:column; justify-content:space-between; }
.dl .k { font-size:14px; } .dl .t { font-family:IDisp; font-weight:800; font-size:36px; letter-spacing:-.025em; line-height:1.05; }

</style></head>
<body><div id="stage"><canvas id="cv"></canvas><div id="dom"></div></div>
<script>
const V = location.hash==='#v';
const W = V?1080:1920, H = V?1920:1080;
const P = (h,v)=>V?v:h;
const stage=document.getElementById('stage'); stage.style.width=W+'px'; stage.style.height=H+'px';
document.body.style.width=W+'px'; document.body.style.height=H+'px';
const cv=document.getElementById('cv'); cv.width=W; cv.height=H; const cx=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)); const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>x>=1?1:1-Math.pow(2,-10*x); const ei=x=>x*x*x; const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const bo=x=>{ if(x<=0) return 0; if(x>=1) return 1; const c1=1.9,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };
const lerp=(a,b,p)=>a+(b-a)*p; const BEAT=.5;
function rnd(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
const COL={paper:'#F5F1E8',cob:'#2346FF',org:'#FF5B1F',yel:'#FFC531',navy:'#0E1A3D',sky:'#DCE3FF'};
const dom=document.getElementById('dom'); const els=[]; const hls=[];
function add(html,x,y,o={}){ const d=document.createElement('div'); d.className='a '+(o.cls||''); d.innerHTML=html; d.style.left=x+'px'; d.style.top=y+'px';
  if(o.w) d.style.width=o.w+'px'; if(o.h) d.style.height=o.h+'px'; if(o.style) d.style.cssText+=';'+o.style; (o.parent||dom).appendChild(d);
  if(o.in!==undefined) els.push({el:d,in:o.in,out:o.out??1e9,fx:o.fx||'rise',dy:o.dy??30,dx:o.dx??0,dur:o.dur||.5,odur:o.odur||.25,rot:o.rot||0}); return d; }
function applyEl(o,t){ const pi=seg(t,o.in,o.in+o.dur), po=ei(seg(t,o.out,o.out+o.odur)); let op, tr;
  if(o.fx==='pop'){ const s=bo(pi); op=clamp(pi*4)*(1-po); tr=`scale(${s*(1-.3*po)}) rotate(${o.rot*(1-s)}deg)`; }
  else if(o.fx==='fade'){ op=eo(pi)*(1-po); tr=''; }
  else if(o.fx==='sx'){ op=1-po; tr=`scaleX(${eo(pi)})`; o.el.style.transformOrigin='left center'; if(pi<=0) op=0; }
  else { const e=eo(pi); op=e*(1-po); tr=`translate(${o.dx*(1-e)}px,${o.dy*(1-e)-o.dy*.6*po}px)`; }
  o.el.style.opacity=op; o.el.style.transform=tr; o.el.style.visibility=op<=.001?'hidden':'visible'; }
// wrapping headline with per-word mask; *word = accent class given in opt.acc ; _word = marker
function hl(text,x,y,size,w,tin,tout,o={}){ const d=document.createElement('div'); d.className='hl '+(o.cls||''); d.style.left=x+'px'; d.style.top=y+'px'; d.style.fontSize=size+'px'; d.style.width=w+'px';
  if(o.align) d.style.textAlign=o.align; if(o.lh) d.style.lineHeight=o.lh; if(o.color) d.style.color=o.color; if(o.weight) d.style.fontWeight=o.weight;
  const words=text.split(' '), inner=[]; words.forEach((wd,i)=>{ let c=''; if(wd[0]==='*'){c=o.acc||'c-cob'; wd=wd.slice(1);} else if(wd[0]==='_'){c='mk'; wd=wd.slice(1);}
    const s=document.createElement('span'); s.className='w'; const k=document.createElement('span'); k.textContent=wd; if(c) k.className=c; s.appendChild(k); d.appendChild(s); if(i<words.length-1) d.appendChild(document.createTextNode(' ')); inner.push(k); });
  dom.appendChild(d); const h={el:d,words:inner,tin,tout,st:o.st??.045,ost:o.ost??.015}; hls.push(h); return h; }
function applyHl(h,t){ let any=false; h.words.forEach((k,i)=>{ const pi=eo(seg(t,h.tin+i*h.st,h.tin+i*h.st+.5)), po=ei(seg(t,h.tout+i*h.ost,h.tout+i*h.ost+.25));
  k.style.transform=`translateY(${(1-pi)*110-po*110}%)`; if(pi>0&&po<1) any=true; }); h.el.style.visibility=any?'visible':'hidden'; }
// icons
const IC={
 doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M15 17.5l2 2 3.5-4"/>',
 shield:'<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
 slides:'<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8M7 12l3-3 2 2 4-4"/>',
 search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
 card:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',
 person:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/>',
 db:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3 3 7 3s7-1.3 7-3"/>',
 bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 bot:'<rect x="4" y="6" width="16" height="13" rx="4"/><circle cx="9.5" cy="12.5" r="1.3"/><circle cx="14.5" cy="12.5" r="1.3"/>',
 send:'<path d="M4 12l16-8-6 16-3-6z"/>',
};
const svg=k=>`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;
// agent characters
const agents=[];
function agent(x,y,s,color,tin,tout,o={}){ const d=document.createElement('div'); d.className='ag'; d.style.cssText=`left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${s}px;background:${color}`;
  d.innerHTML='<div class="e l"><i></i></div><div class="e r"><i></i></div>'; (o.parent||dom).appendChild(d);
  const a={el:d,tin,tout,ph:o.ph??Math.random()*6,look:o.look||(()=>[0,0]),bob:o.bob??1,pupils:[...d.querySelectorAll('.e i')],eyes:[...d.querySelectorAll('.e')],rot:o.rot??-12}; agents.push(a); return a; }
function applyAgent(a,t){ const pi=seg(t,a.tin,a.tin+.45), po=ei(seg(t,a.tout,a.tout+.25)); const s=bo(pi)*(1-po);
  const by=a.bob*Math.sin(t*2*Math.PI*1+a.ph)*6; a.el.style.transform=`translateY(${by}px) scale(${s}) rotate(${a.rot*(1-bo(pi))+Math.sin(t*3+a.ph)*3}deg)`;
  a.el.style.visibility=s<=.001?'hidden':'visible'; const blink=((t*.8+a.ph)%3.1)<.12; a.eyes.forEach(e=>e.style.transform=`scaleY(${blink?.12:1})`);
  const [lx,ly]=a.look(t); a.pupils.forEach(p=>p.style.transform=`translate(${lx*45}%,${ly*45}%)`); }

const ML=P(140,80), CW=P(1640,920);

// ======================= S1 HOOK 0-8 =======================
hl('AI agents are everywhere.', ML, P(420,780), P(150,118), CW, .15, 1.75, {align:'center'});
hl('Everyone is talking about *them.', ML, P(420,780), P(150,118), CW, 1.85, 3.85, {align:'center', acc:'c-org'});
const R1=rnd(5);
const HPOS = V ? [[170,260],[540,190],[900,300],[150,560],[930,560],[260,1350],[640,1300],[920,1460],[180,1650],[540,1720],[880,1700],[400,470]]
               : [[240,190],[640,140],[1100,170],[1560,200],[1760,420],[200,760],[560,880],[980,860],[1420,880],[1760,760],[860,300],[1300,320]];
const HCOL=[COL.cob,COL.org,COL.yel,COL.navy,COL.cob,COL.yel,COL.org,COL.cob,COL.navy,COL.yel,COL.org,COL.cob];
const hookAg=HPOS.map((p,i)=>agent(p[0],p[1],P(96,92)-(i%3)*12,HCOL[i],i*.25,3.7+R1()*.2,{look:t=>[Math.sin(t*1.3+i),Math.cos(t*1.1+i)*.5]}));
const TOOLS=['search','db','card','doc','cal','bolt'];
const toolIc=HPOS.slice(0,8).map((p,i)=>{ const ox=P(110,95)*(i%2?1:-1), oy=P(60,70)*((i>>1)%2?1:-1);
  return {d:add(`<div class="ic" style="width:56px;height:56px;border-radius:16px;background:#fff;border:2px solid var(--navy);display:flex;align-items:center;justify-content:center">${svg(TOOLS[i%6])}</div>`, p[0]+ox-28, p[1]+oy-28, {in:.5+i*.25, out:3.7, fx:'pop', rot:20}), ax:p[0], ay:p[1], tx:p[0]+ox, ty:p[1]+oy, t0:.5+i*.25}; });
['Agents!','Copilots','Autonomous','AI!','Multi-agent'].forEach((b,i)=>{ const p=HPOS[[1,3,7,9,5][i]];
  add(b, p[0]+P(40,30), p[1]-P(110,100), {cls:'bub', in:2.0+i*.25, out:3.7, fx:'pop', rot:i%2?8:-8, style:`background:${[COL.yel,'#fff',COL.sky,'#fff',COL.yel][i]}`}); });
hl('But could your team actually _build _one?', ML, P(300,560), P(132,108), P(1250,920), 4.0, 7.3, {lh:1.08});
const qAg=agent(P(1560,540), P(700,1420), P(250,260), COL.cob, 4.6, 7.4, {look:t=>[-.9,-.35], rot:-20});
add('?', P(1660,640), P(520,1210), {cls:'bub', in:5.25, out:7.3, fx:'pop', rot:15, style:'font-size:64px;padding:6px 30px;background:var(--yel)'});

// ======================= S2 OPPORTUNITY 8-18 =======================
hl('Imagine your team going beyond *ChatGPT *prompts.', ML, P(220,200), P(96,88), P(900,920), 8.0, 10.85, {acc:'c-cob'});
const PB=add(`<div style="width:${P(700,920)}px;height:150px;background:#fff;border:2px solid var(--navy);border-radius:28px;display:flex;align-items:center;padding:0 32px;gap:20px">
  <span id="ptxt" style="font-size:30px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden"></span>
  <span style="width:64px;height:64px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center" class="ic">${svg('send')}</span></div>`,
  P(1080,80), P(380,800), {in:8.2, out:10.7, fx:'rise', dy:40});
add('<span class="mono" style="font-size:15px;color:#6b7390">Prompt · reply · repeat</span>', P(1080,80), P(560,980), {in:8.5, out:10.7, fx:'fade'});
hl('Understanding how agents *think, use *tools, solve *problems and interact with real business *systems.', ML, P(200,170), P(62,62), P(760,920), 11.0, 17.3, {acc:'c-cob'});
// workflow box
const BO=V?{x:60,y:700}:{x:920,y:210};
const B=(x,y)=>[BO.x+x,BO.y+y];
add('<span class="mono" style="font-size:14px;color:#6b7390">Case · SoukGo, a fictional delivery app</span>', ...B(0,-34), {in:11.1, out:17.3, fx:'fade'});
add('My drink is missing from my order.', ...B(0,0), {cls:'bub', in:11.25, out:17.3, fx:'pop', rot:-6, style:'background:var(--navy);color:#fff;font-size:26px'});
const wfAg=agent(...B(95,250), 140, COL.cob, 11.75, 17.4, {look:t=>t<12.6?[-.3,-.9]:(t<14.4?[1,0]:[.3,.9]), rot:-15});
const think=[0,1,2].map(i=>add('', ...B(190+i*26,170), {w:16,h:16,style:'border-radius:50%;background:var(--navy)'}));
const WT=[['search','get_order','#fff'],['shield','check_refund_eligibility','#fff'],['person','escalate_case','#fff']];
const wtc=WT.map((w,i)=>add(`${svg(w[0])}<span class="code">${w[1]}</span>`, ...B(380,150+i*82), {cls:'chip', in:12.625+i*.125, out:17.3, fx:'pop', rot:4}));
const SYS=[['db','Orders'],['shield','Policy engine'],['card','Ledger']];
const sysc=SYS.map((s,i)=>add(`<div style="display:flex;align-items:center;gap:12px;font-family:IDisp;font-weight:700;font-size:26px">${svg(s[0])}${s[1]}</div>`, ...B(i*320,450), {cls:'chip', w:290, h:76, in:14.5+i*.25, out:17.3, fx:'rise', dy:20, style:'border-radius:20px'}));
add(`<div style="display:flex;align-items:center;gap:14px"><span style="width:40px;height:40px;border-radius:50%;background:var(--cob);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800">✓</span><span style="font-family:IDisp;font-weight:700;font-size:28px">Refund of MAD 20 proposed. Customer confirms.</span></div>`,
  ...B(0,590), {in:15.75, out:17.3, fx:'pop', rot:-3});

// ======================= S3 INTRODUCING 18-30 =======================
add('<span class="mono" style="font-size:22px;color:var(--yel)">Introducing</span>', ML, P(250,600), {in:18.0, out:21.3, dy:16});
const TL=['LAUNCHING','AI AGENTS','IN COMPANIES'];
TL.forEach((l,i)=>hl(l, ML, P(300+i*150,650+i*130), P(156,122), CW, 18.25+i*.5, 21.3, {color:i===1?COL.yel:'#fff', st:.03}));
const shapes=[
  add(`<div style="width:${P(180,170)}px;height:${P(180,170)}px;border-radius:50%;background:var(--yel)"></div>`, P(1500,720), P(230,250), {in:18.3, out:21.3, fx:'pop', rot:90}),
  add(`<svg width="${P(200,180)}" height="${P(180,160)}" viewBox="0 0 100 90"><path d="M50 0L100 90H0z" fill="#FF5B1F"/></svg>`, P(1640,180), P(560,1180), {in:18.8, out:21.3, fx:'pop', rot:-120}),
  add(`<div style="width:${P(150,150)}px;height:${P(150,150)}px;border-radius:26px;background:var(--cob)"></div>`, P(1350,820), P(220,1450), {in:19.3, out:21.3, fx:'pop', rot:60}),
];
const tAg=agent(P(1700,880), P(820,1600), 150, COL.cob, 19.6, 21.3, {look:t=>[-1,-.4]});
hl('A hands-on, two-day workshop designed to take your team from understanding AI agents to building and evaluating one *themselves.', ML, P(200,170), P(54,58), P(800,920), 22.0, 29.85, {acc:'c-org', st:.03});
add('<span class="mono" style="font-size:15px;color:#6b7390">Launching AI Agents in Companies</span>', ML, P(160,128), {in:22.0, out:29.85, fx:'fade'});
const DAYS=[[COL.cob,'Day 1','Understand & build',['Problem framing','How agents work','Build lab']],[COL.org,'Day 2','Evaluate & deploy',['Evaluation','Guardrails & risk','Rollout & monitoring','Final pitch']]];
DAYS.forEach((d,i)=>{ const x=P(1000+i*440,80+i*480), y=P(180,720), w=P(420,440), h=P(560,600);
  const c=add(`<div style="padding:34px;color:#fff;height:100%;display:flex;flex-direction:column">
    <span class="mono" style="font-size:18px;opacity:.85">${d[1]}</span>
    <span style="font-family:IDisp;font-weight:800;font-size:${P(50,48)}px;letter-spacing:-.03em;line-height:1.02;margin-top:14px">${d[2]}</span>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:12px" class="dchips">${d[3].map(c=>`<span class="pill" style="background:rgba(255,255,255,.18);font-size:22px;font-weight:600;padding:10px 18px">${c}</span>`).join('')}</div></div>`,
    x, y, {cls:'card', w, h, in:24.0+i*.5, out:29.85, fx:'pop', rot:i?6:-6, style:`background:${d[0]}`});
});
['12 hours','Teams of 4–5','No coding required'].forEach((f,i)=>add(`<span class="pill mono" style="font-size:15px;background:var(--yel);color:var(--navy)">${f}</span>`, P(1000+i*215,80+i*290), P(800,1380), {in:26.0+i*.25, out:29.85, fx:'pop', rot:-8}));

// ======================= S4 WHAT THEY DO 30-42 =======================
hl('Your team will explore real business *opportunities, design an *agent, build a working *prototype and put it to the *test.', ML, P(130,150), P(54,56), CW, 30.0, 35.6, {acc:'c-cob', st:.03});
hl('They’ll learn how to *evaluate performance, establish *guardrails, manage *risks and understand what it takes to *deploy AI responsibly.', ML, P(130,150), P(54,56), CW, 35.75, 41.35, {acc:'c-org', st:.03});
const TP = V ? [[90,640],[590,640],[90,1150],[590,1150]] : [[140,400],[560,400],[980,400],[1400,400]];
const TA=[['Explore',COL.yel,'#0E1A3D'],['Design',COL.cob,'#fff'],['Build',COL.org,'#fff'],['Test',COL.navy,'#fff']];
const TB=[['Evaluate',COL.yel,'#0E1A3D'],['Guardrails',COL.cob,'#fff'],['Risks',COL.org,'#fff'],['Deploy',COL.navy,'#fff']];
const tiles=[];
TP.forEach((p,i)=>{ const T=add('', p[0], p[1], {cls:'tile', in:30.5+i*1.25, out:41.35, fx:'pop', rot:i%2?5:-5});
  const fa=document.createElement('div'); fa.className='face'; const fb=document.createElement('div'); fb.className='face';
  fa.innerHTML=`<div class="hd mono" style="background:${TA[i][1]};color:${TA[i][2]}"><b>0${i+1}</b>${TA[i][0]}</div><div class="bd"></div>`;
  fb.innerHTML=`<div class="hd mono" style="background:${TB[i][1]};color:${TB[i][2]}"><b>0${i+5}</b>${TB[i][0]}</div><div class="bd"></div>`;
  T.appendChild(fa); T.appendChild(fb); tiles.push({T,fa,fb,ba:fa.querySelector('.bd'),bb:fb.querySelector('.bd'),flip:35.75+i*.25}); });
const inT=(tile,face,html,x,y,o={})=>add(html,x,y,{...o,parent:tiles[tile][face]});
// A1 explore

const WIPES=[[0,COL.paper],[17.65,COL.navy],[21.65,COL.paper],[41.65,COL.cob],[45.65,COL.paper],[53.65,COL.cob]];
function drawBg(t){ let prev=COL.paper, cur=COL.paper, p=1;

  cx.fillStyle=prev; cx.fillRect(0,0,W,H); if(p>0){ cx.fillStyle=cur; cx.beginPath(); const d=W*.35, x=-d+(W+2*d)*p;
    cx.moveTo(-10,-10); cx.lineTo(x+d,-10); cx.lineTo(x-d,H+10); cx.lineTo(-10,H+10); cx.fill(); } }
function line(x1,y1,x2,y2,p,col,w=3,dash){ if(p<=0) return; cx.strokeStyle=col; cx.lineWidth=w; cx.lineCap='round'; if(dash) cx.setLineDash(dash); cx.beginPath(); cx.moveTo(x1,y1); cx.lineTo(lerp(x1,x2,p),lerp(y1,y2,p)); cx.stroke(); cx.setLineDash([]); }
function curve(x1,y1,x2,y2,p,col,w=3){ if(p<=0) return; cx.strokeStyle=col; cx.lineWidth=w; cx.beginPath(); cx.moveTo(x1,y1); const mx=(x1+x2)/2; const N=30;
  for(let k=1;k<=N*p;k++){ const q=k/N; const bx=Math.pow(1-q,3)*x1+3*(1-q)*(1-q)*q*mx+3*(1-q)*q*q*mx+q*q*q*x2, by=Math.pow(1-q,3)*y1+3*(1-q)*(1-q)*q*y1+3*(1-q)*q*q*y2+q*q*q*y2; cx.lineTo(bx,by);} cx.stroke(); }
function bezPt(x1,y1,x2,y2,q){ const mx=(x1+x2)/2; return [Math.pow(1-q,3)*x1+3*(1-q)*(1-q)*q*mx+3*(1-q)*q*q*mx+q*q*q*x2, Math.pow(1-q,3)*y1+3*(1-q)*(1-q)*q*y1+3*(1-q)*q*q*y2+q*q*q*y2]; }
const GR=(()=>{ const r=rnd(3), a=[]; const cols=P(32,18), rows=P(18,32); for(let j=0;j<rows;j++) for(let i=0;i<cols;i++) a.push([i,j,r()]); return {a,cols,rows}; })();
function drawCanvas(t){
  drawBg(t);

  if(t<3.95){ const o=1-seg(t,3.6,3.85); toolIc.forEach(ti=>{ const p=eo(seg(t,ti.t0+.1,ti.t0+.5)); line(ti.ax,ti.ay,ti.tx,ti.ty,p,`rgba(14,26,61,${.35*o})`,2.5,[6,8]); });
    for(let i=0;i<HPOS.length-1;i+=2){ const a=HPOS[i], b=HPOS[i+1]; const p=eo(seg(t,.6+i*.2,1.2+i*.2)); line(a[0],a[1],b[0],b[1],p,`rgba(35,70,255,${.25*o})`,2.5); } }
  // workflow lines
  if(t>=11.5 && t<17.6){ const o=1-seg(t,17.2,17.5); const nv=`rgba(14,26,61,${.5*o})`;
    const [ax,ay]=B(165,250);
    WT.forEach((w,i)=>{ const [tx,ty]=B(380,179+i*82); curve(ax,ay,tx,ty,eo(seg(t,12.7+i*.12,13.1+i*.12)),nv,2.5); });
    const sel = t<13.6?0:1; if(t>13.0){ const [tx,ty]=B(380,179+sel*82); curve(ax,ay,tx,ty,1,`rgba(35,70,255,${o})`,5); const q=(t*1.4)%1; const [px,py]=bezPt(ax,ay,tx,ty,q); cx.fillStyle=`rgba(255,91,31,${o})`; cx.beginPath(); cx.arc(px,py,7,0,6.28); cx.fill(); }
    [0,1,2].forEach(i=>{ const [sx,sy]=B(145+i*320,450); const [tx,ty]=B(560,179+Math.min(i,1)*82+30); line(tx,ty,sx,sy,eo(seg(t,14.5+i*.2,14.9+i*.2)),`rgba(35,70,255,${.6*o})`,2.5,[4,8]); });
  }
  // agent field (instructor)
  if(t>=41.7 && t<45.8){ const o=1-seg(t,45.3,45.6); const cw=W/GR.cols, ch=H/GR.rows, s=Math.min(cw,ch)*.46;
    for(const [i,j,r] of GR.a){ const x=(i+.5)*cw, y=(j+.5)*ch; const wave=seg(t,41.9+(i/GR.cols)*1.6+r*.4,42.2+(i/GR.cols)*1.6+r*.4); const lit=wave>0 && r<.55;
      const inTxt = V ? (y>560 && y<1120) : (x<1500 && y>290 && y<660); const k=inTxt?.25:1;
      cx.fillStyle= lit ? `rgba(255,197,49,${(.35+.4*(r<.12))*o*k})` : `rgba(255,255,255,${.1*o*k})`; const ss=s*(.6+.4*eo(wave));
      cx.beginPath(); cx.roundRect(x-ss/2,y-ss/2,ss,ss,ss*.28); cx.fill();
      if(lit&&!inTxt){ cx.fillStyle=`rgba(35,70,255,${o})`; cx.fillRect(x-ss*.22,y-ss*.1,ss*.12,ss*.18); cx.fillRect(x+ss*.1,y-ss*.1,ss*.12,ss*.18); } } }
  // final: floating shapes
  if(t>=54){ const p=bo(seg(t,54.2,54.9)); cx.fillStyle=COL.org; cx.beginPath(); cx.arc(P(1500,960),P(200,180)+Math.sin(t*2)*6,P(70,60)*p,0,6.28); cx.fill();
    cx.strokeStyle=COL.yel; cx.lineWidth=10; cx.beginPath(); cx.arc(P(1820,180),P(900,1840),P(140,150)*p,0,6.28); cx.stroke(); }
}

  // injection bounce on guardrails

    const x=20+lerp(0,110,eio(p))-lerp(0,90,eo(q)), y=10+lerp(0,70,eio(p))+lerp(0,90,eio(q)); inj.style.transform=`translate(${x-20}px,${y-10}px) rotate(${-25*eo(q)}deg)`; inj.style.opacity= t<36.5?0:(1-seg(t,38.6,39)); }
  // CTA press
