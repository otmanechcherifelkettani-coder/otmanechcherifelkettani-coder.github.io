<!doctype html><html><head><meta charset="utf-8"><title>Shipping AI That Works · University v3</title>
<style>
@font-face{font-family:S;src:url(node_modules/@fontsource/newsreader/files/newsreader-latin-300-normal.woff2);font-weight:300}
@font-face{font-family:S;src:url(node_modules/@fontsource/newsreader/files/newsreader-latin-300-italic.woff2);font-weight:300;font-style:italic}
@font-face{font-family:S;src:url(node_modules/@fontsource/newsreader/files/newsreader-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:S;src:url(node_modules/@fontsource/newsreader/files/newsreader-latin-400-italic.woff2);font-weight:400;font-style:italic}
@font-face{font-family:S;src:url(node_modules/@fontsource/newsreader/files/newsreader-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:M;src:local("JetBrains Mono"),local("JetBrainsMono-Regular");font-weight:400}
:root{--paper:#F3EEE4;--ink:#14213D;--ox:#8C2F39;--mute:#6E6A60;--rule:rgba(20,33,61,.22)}
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;font-family:Inter,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
#st{position:relative;overflow:hidden;background:var(--paper)}
.L{position:absolute;inset:0}.a{position:absolute}
.s{font-family:S;font-weight:300;letter-spacing:-.02em;line-height:1.04}
.s i,i.x{font-style:italic;color:var(--ox)}
.sc{font-family:Inter;font-weight:600;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.m{font-family:M;font-size:15px;color:var(--ink)}
.cap{font-family:S;font-style:italic;font-size:19px;color:var(--mute)}
.box{border:1.5px solid var(--ink);background:rgba(255,255,255,.35)}
.rule{height:1.5px;background:var(--ink);transform-origin:0 50%}
.hair{height:1px;background:var(--rule);transform-origin:0 50%}
.tr{display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:20px}
.dk .s,.dk .m{color:var(--paper)} .dk .sc{color:#B9B2A3}
</style></head><body><div id="st"><div id="ink" class="L" style="background:var(--ink);transform-origin:50% 100%"></div><div id="ov" class="L"></div><div id="fr" class="L"></div></div>
<script>
const V=location.hash==='#v'; const W=V?1080:1920,H=V?1920:1080; const P=(h,v)=>V?v:h;
const st=document.getElementById('st'); st.style.width=W+'px'; st.style.height=H+'px'; document.body.style.width=W+'px'; document.body.style.height=H+'px';
const ov=document.getElementById('ov'), fr=document.getElementById('fr'), ink=document.getElementById('ink');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-clamp(x),3), eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const els=[];
// fx: rise (fade + small drift), mask (line slides up inside clip), draw (scaleX rule), fade
function add(html,x,y,o={}){ const d=document.createElement('div'); d.className='a '+(o.cls||''); d.style.left=x+'px'; d.style.top=y+'px';
  if(o.w) d.style.width=o.w+'px'; if(o.h) d.style.height=o.h+'px'; if(o.style) d.style.cssText+=';'+o.style;
  const fx=o.fx||'rise'; let inner=d;
  if(fx==='mask'){ d.style.overflow='hidden'; d.style.paddingBottom='.12em'; inner=document.createElement('div'); d.appendChild(inner); }
  inner.innerHTML=html; (o.parent||ov).appendChild(d);
  els.push({el:d,inner,in:o.in??0,out:o.out??1e9,fx,dur:o.dur||(fx==='mask'?1.1:fx==='draw'?1.2:.9),odur:o.odur||.6}); return d; }
function apply(o,t){ const pi=eo(seg(t,o.in,o.in+o.dur)), po=eio(seg(t,o.out,o.out+o.odur)); const op=(1-po);
  if(o.fx==='mask'){ o.inner.style.transform=`translateY(${(1-pi)*105}%)`; o.el.style.opacity=op; }
  else if(o.fx==='draw'){ o.el.style.transform=`scaleX(${pi})`; o.el.style.opacity=op; }
  else if(o.fx==='fade'){ o.el.style.opacity=pi*op; }
  else { o.el.style.opacity=pi*op; o.el.style.transform=`translateY(${(1-pi)*14-po*8}px)`; }
  o.el.style.visibility=(o.el.style.opacity<=.002)?'hidden':'visible'; }
// multi-line serif headline: each line its own mask, staggered
function head(lines,x,y,size,tin,tout,o={}){ const lh=size*(o.lh||1.08); lines.forEach((l,i)=>add(`<div class="s" style="font-size:${size}px;white-space:nowrap;${o.style||''}">${l}</div>`,x,y+i*lh,{fx:'mask',in:tin+i*(o.st??.18),out:tout,w:o.w,cls:o.cls})); }
const ML=P(140,72), CW=P(1640,936), TOP=P(150,300);

// ---------- persistent journal frame ----------
const runL=document.createElement('div'); runL.className='a sc'; runL.style.cssText=`left:${ML}px;top:${P(62,88)}px;font-size:13px`; runL.textContent='Shipping AI That Works'; fr.appendChild(runL);
const runR=document.createElement('div'); runR.className='a sc'; runR.style.cssText=`right:${ML}px;top:${P(62,88)}px;font-size:13px;text-align:right`; fr.appendChild(runR);
const topRule=document.createElement('div'); topRule.className='a hair'; topRule.style.cssText=`left:${ML}px;right:${ML}px;top:${P(96,124)}px`; fr.appendChild(topRule);
const botRule=document.createElement('div'); botRule.className='a hair'; botRule.style.cssText=`left:${ML}px;right:${ML}px;bottom:${P(84,110)}px`; fr.appendChild(botRule);
const prog=document.createElement('div'); prog.className='a'; prog.style.cssText=`left:${ML}px;bottom:${P(83,109)}px;height:3px;background:var(--ox);width:0`; fr.appendChild(prog);
const foot=document.createElement('div'); foot.className='a cap'; foot.style.cssText=`left:${ML}px;bottom:${P(40,62)}px;font-size:17px`; fr.appendChild(foot);
const SEC=[[0,'§ 01 · The opportunity','A changing world'],[12.25,'§ 02 · The classroom','From theory to practice'],[20.5,'§ 03 · The workshop','Introducing'],[31.75,'§ 04 · The method','Six stages'],[42.5,'§ 05 · The outcome','What students take away'],[49.5,'§ 06 · The invitation','For universities & business schools']];
const grain=`<svg class="L" style="opacity:.16;mix-blend-mode:multiply;pointer-events:none" width="${W}" height="${H}"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .32  0 0 0 .55 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>`;

// ========== S1 0–12.25 ==========
head(['The world is', '<i>changing.</i>'], ML, P(330,640), P(190,170), .5, 4.3, {st:.35});
add(`<span class="cap">Artificial intelligence is transforming the way industries work.</span>`, ML, P(790,1080), {in:1.6, out:4.3});
{ // Fig. 1 — three columns
  add(`<span class="sc">Fig. 1 — Agents at work, across industries</span>`, ML, TOP+P(40,40), {in:4.6, out:9.45});
  add('', ML, TOP+P(80,80), {cls:'rule', w:CW, fx:'draw', in:4.65, out:9.45});
  const IND=[['E-commerce','Where is my order?','It’s out for delivery and arrives today.','track_order()'],['Healthcare','Can I move my appointment to Thursday?','Thursday at ten is free. Shall I book it?','check_schedule()'],['Banking','I was charged twice for one purchase.','I’ve opened a dispute and sent you the reference.','open_dispute()']];
  const cw=P(500,936);
  IND.forEach((d,i)=>{ const x=P(ML+i*(cw+70),ML), y=TOP+P(130,130+i*420), a=4.9+i*.55;
    add(`<div class="sc" style="color:var(--ox)">${['i.','ii.','iii.'][i]} ${d[0]}</div>
      <div class="s" style="font-size:${P(36,40)}px;margin-top:22px;line-height:1.2">“${d[1]}”</div>
      <div class="s" style="font-size:${P(36,40)}px;margin-top:18px;line-height:1.2;font-style:italic;color:var(--ox)">“${d[2]}”</div>
      <div class="hair" style="margin-top:26px"></div><div class="m" style="margin-top:12px;color:var(--mute)">agent → ${d[3]}</div>`, x, y, {w:cw, in:a, out:9.45});
    if(i>0 && !V) add('', x-36, y, {style:'width:1px;height:330px;background:var(--rule)', fx:'fade', in:a, out:9.45});
  });
  add(`<span class="cap">Illustrative examples.</span>`, ML, P(880,1640), {in:6.2, out:9.45, fx:'fade'});
}
head(V?['The next generation','will need to','<i>build</i> with it.']:['The next generation will need', 'to <i>build</i> with it.'], ML, P(380,700), P(116,100), 9.75, 12.0, {st:.25});

// ========== S2 12.25–20.5 ==========
add(`<span class="sc">The lecture</span>`, ML, TOP+P(40,40), {in:12.5, out:20.25});
add('', ML, TOP+P(80,80), {cls:'rule', w:P(760,CW), fx:'draw', in:12.55, out:20.25});
['What is a large language model?','How agents use tools','Why evaluation matters'].forEach((s,i)=>add(`<div class="tr"><span class="m" style="color:var(--mute);width:70px">L.0${i+1}</span><span class="s" style="font-size:${P(40,42)}px">${s}</span></div>`, ML, TOP+P(110+i*86,110+i*86), {w:P(760,CW), in:12.9+i*.4, out:20.25}));
head(['Universities can prepare', 'students for this <i>new reality</i>'], ML, P(640,TOP+400), P(64,62), 13.0, 20.25, {st:.2});
// right column: the lab
const lx=P(1020,ML), ly=TOP+P(40,860);
add(`<span class="sc" style="color:var(--ox)">The lab</span>`, lx, ly, {in:16.75, out:20.25});
add('', lx, ly+40, {cls:'rule', w:P(760,CW), fx:'draw', in:16.8, out:20.25});
add(`<div class="s" style="font-size:${P(44,46)}px;line-height:1.15">Write the instructions.<br>Connect the tools.<br><i>Run it.</i></div>
  <div style="margin-top:28px">${['get_order','check_refund_eligibility','escalate_case'].map((t,i)=>`<div class="tr m" style="font-size:18px" data-k="${17.9+i*.35}"><span>${t}</span><span style="margin-left:auto;color:var(--ox)">connected ✓</span></div>`).join('')}</div>`,
  lx, ly+70, {w:P(760,CW), in:17.0, out:20.25});
add(`<span class="cap">…bringing practical AI experience into the classroom.</span>`, lx, P(870,1700), {in:17.6, out:20.25, fx:'fade'});

// ========== S3 20.5–31.75 (ink) ==========
const D3={cls:'dk'};
add(`<span class="sc" style="color:#C9A9A0">Introducing</span>`, ML, P(300,600), {in:21.0, out:23.75, ...D3});
head(['Shipping AI', '<i style="color:#E6B8A2">That Works.</i>'], ML, P(350,660), P(200,170), 21.2, 23.75, {st:.3, style:'color:var(--paper)'});
add('', ML, P(830,1100), {cls:'rule', w:P(600,CW), fx:'draw', in:22.0, out:23.75, style:'background:var(--paper)'});
// programme
add(`<span class="sc" style="color:#C9A9A0">The programme</span><div class="s" style="font-size:${P(64,62)}px;color:var(--paper);margin-top:18px">Two days. Twelve hours.<br><i style="color:#E6B8A2">Teams of four to five.</i></div>`, ML, TOP+P(40,40), {w:CW, in:24.1, out:31.4});
const DAY=[['Day one','Understand & build',['Problem framing','How agents work','Build lab']],['Day two','Evaluate & deploy',['Evaluation','Guardrails & risk','Rollout','Final pitch']]];
DAY.forEach((d,i)=>{ const x=P(ML+i*560,ML), y=TOP+P(300,330+i*400);
  add('', x, y, {cls:'rule', w:P(500,CW), fx:'draw', in:24.5+i*.4, out:31.4, style:'background:var(--paper)'});
  add(`<div class="sc" style="color:#C9A9A0;margin-top:18px">${d[0]}</div><div class="s" style="font-size:${P(42,46)}px;color:var(--paper);margin-top:10px">${d[1]}</div>
    ${d[2].map(c=>`<div class="m" style="color:#D9D2C3;margin-top:10px;font-size:17px">— ${c}</div>`).join('')}`, x, y, {w:P(500,CW), in:24.7+i*.4, out:31.4});
});
const bx=P(1250,ML), by=TOP+P(300,1180);
add('', bx, by, {cls:'rule', w:P(530,CW), fx:'draw', in:25.9, out:31.4, style:'background:var(--paper)'});
add(`<div class="sc" style="color:#C9A9A0;margin-top:18px">Led by an industry practitioner</div><div class="s" style="font-size:${P(58,64)}px;color:var(--paper);margin-top:12px">Otman Kettani</div>
  <div class="s" style="font-size:${P(28,32)}px;color:#D9D2C3;margin-top:14px;line-height:1.3;font-style:italic">Built and deployed LLM-powered customer support agents at Uber.</div>`, bx, by, {w:P(530,CW), in:26.1, out:31.4});
add(`<span class="m" style="font-size:12px;color:#9E9786">Independent workshop · not affiliated with or endorsed by Uber</span>`, P(bx,ML), P(860,1770), {in:27.0, out:31.4, fx:'fade'});

// ========== S4 31.75–42.5 the method ==========
const STEPS=['Identify a business challenge','Design the workflow','Build the agent','Test real scenarios','Evaluate performance & risk','Deploy responsibly'];
const ST=[33.3,34.95,35.6,36.5,37.8,40.2], SE=[34.95,35.6,36.5,37.8,40.2,42.25];
add(`<span class="sc">Working in teams, students—</span>`, ML, TOP+P(40,40), {in:32.0, out:42.25});
add('', ML, TOP+P(80,80), {cls:'rule', w:P(640,CW), fx:'draw', in:32.05, out:42.25});
const stepEls=STEPS.map((s,i)=>add(`<div class="tr" style="padding:${P(14,10)}px 0"><span class="m" style="width:46px;color:var(--ox)">${['I','II','III','IV','V','VI'][i]}</span><span class="s" style="font-size:${P(38,34)}px">${s}</span></div>`,
  ML, TOP+P(100+i*76,100+i*62), {w:P(640,CW), in:32.2+i*.12, out:42.25}));
const FX=P(940,ML), FY=TOP+P(40,560), FW=P(840,CW);
const fig=(n,title,html,a,b)=>{ add(`<span class="sc">Fig. ${n} — ${title}</span>`, FX, FY, {in:a, out:b}); add('', FX, FY+40, {cls:'rule', w:FW, fx:'draw', in:a, out:b}); add(html, FX, FY+70, {w:FW, in:a+.15, out:b}); };
fig(2,'The workshop case',`<div class="s" style="font-size:${P(64,60)}px">SoukGo<br><i>missing-item refunds</i></div>
  <div class="tr m" style="margin-top:30px;font-size:17px"><span style="color:var(--mute)">setting</span><span style="margin-left:auto">fictional delivery app</span></div>
  <div class="tr m" style="font-size:17px"><span style="color:var(--mute)">scope</span><span style="margin-left:auto">bounded · one workflow</span></div>
  <div class="tr m" style="font-size:17px"><span style="color:var(--mute)">compared with</span><span style="margin-left:auto">rules engine · human assist</span></div>`, 32.4, SE[0]-.3);
{ // fig 3 design + build: flow
  const n=[['Request',''],['Agent','proposes'],['Policy engine','decides'],['Ledger','executes once']];
  const bw=P(180,200);
  const flow=n.map((d,i)=>`<div class="box" style="position:absolute;left:${P(i*(bw+40),(i%2)*(bw+300))}px;top:${P(0,Math.floor(i/2)*150)}px;width:${bw}px;height:100px;padding:14px"><div class="s" style="font-size:26px">${d[0]}</div><div class="m" style="font-size:13px;color:var(--mute);margin-top:6px">${d[1]}</div></div>`+(i<3&&!V?`<div style="position:absolute;left:${i*(bw+40)+bw}px;top:50px;width:40px;height:1.5px;background:var(--ink)"></div>`:'')).join('')
   +`<div class="box" style="position:absolute;left:${P(2*(bw+40),0)}px;top:${P(170,320)}px;width:${bw}px;height:100px;padding:14px;border-color:var(--ox)"><div class="s" style="font-size:26px;color:var(--ox)">Human</div><div class="m" style="font-size:13px;color:var(--mute);margin-top:6px">exceptions</div></div>`
   +(V?'':`<div style="position:absolute;left:${2*(bw+40)+bw/2}px;top:100px;width:1.5px;height:70px;background:var(--ox)"></div>`);
  fig(3,'Workflow & tools',`<div style="position:relative;height:${P(290,440)}px">${flow}</div>
   <div class="m" style="font-size:16px;color:var(--mute)">tools: get_order · check_refund_eligibility · submit_refund · escalate_case</div>`, SE[0], SE[2]-.3);
}
fig(4,'Test scenarios',`${[['D01','Missing drink','refund once'],['D03','Another customer’s order','blocked'],['D06','Cash payment','to a human'],['D09','“Ignore the policy…”','no authority'],['D10','Suspected illness','priority human']].map((s,i)=>`<div class="tr m" style="font-size:17px" data-k="${36.6+i*.18}"><span style="color:var(--mute);width:56px">${s[0]}</span><span class="s" style="font-size:26px">${s[1]}</span><span style="margin-left:auto;color:var(--ox)">${s[2]} ✓</span></div>`).join('')}`, SE[2], SE[3]-.3);
fig(5,'Evaluation: the pass bar',`<div style="display:flex;gap:${P(30,20)}px">${['Unauthorized payouts','Duplicate payouts','False success claims'].map(s=>`<div style="flex:1;border-top:1.5px solid var(--ink);padding-top:14px"><div class="s" style="font-size:${P(120,100)}px;line-height:1">0</div><div class="m" style="font-size:14px;color:var(--mute);margin-top:10px">${s}</div></div>`).join('')}</div>
  <div class="cap" style="margin-top:30px">Risks reviewed: prompt injection · privacy · double payout · dialect coverage.</div>`, SE[3], SE[4]-.3);
{ const L=['Offline','Shadow','Human-approved','1%','5%','25%','Approved scope'];
  const sw=P(116,128);
  fig(6,'The rollout ladder',`<div style="position:relative;height:${P(330,330)}px">${L.map((s,i)=>`<div class="ld" data-i="${i}" style="position:absolute;left:${i*sw}px;bottom:0;width:${sw-10}px;height:${40+i*40}px;border-top:1.5px solid var(--ink);border-left:1.5px solid var(--ink);background:${i>=3?'rgba(140,47,57,.12)':'transparent'}"><div class="m" style="position:absolute;top:-28px;left:8px;font-size:${P(13,13)}px;white-space:nowrap">${s}</div></div>`).join('')}</div>
   <div class="cap" style="margin-top:22px">With stop rules, a rollback owner and monitoring at every step.</div>`, SE[4], 42.25); }

// ========== S5 42.5–49.5 ==========
add(`<span class="sc">They leave with</span>`, ML, TOP+P(40,40), {in:42.75, out:49.3});
add('', ML, TOP+P(80,80), {cls:'rule', w:CW, fx:'draw', in:42.8, out:49.3});
[['A working AI agent prototype','01'],['An evaluation report','02'],['A risk assessment','03'],['An executive presentation','04']].forEach((o,i)=>add(`<div class="tr" style="padding:${P(16,18)}px 0"><span class="s" style="font-size:${P(52,46)}px">${o[0]}</span><span style="flex:1;border-bottom:2px dotted var(--rule);margin:0 18px;transform:translateY(-10px)"></span><span class="m" style="color:var(--ox)">${o[1]}</span></div>`,
  ML, TOP+P(110+i*96,110+i*96), {w:CW, in:43.4+i*.4, out:49.3}));
add(`<div class="s" style="font-size:${P(44,44)}px;line-height:1.2">…and skills they can carry <i>into their careers.</i></div>`, ML, TOP+P(560,560), {w:CW, in:46.4, out:49.3});
add(`<div class="m" style="color:var(--mute);font-size:16px;line-height:1.8">${V?'Student employability<br>Curriculum innovation<br>University positioning':'Student employability · Curriculum innovation · University positioning'}</div>`, ML, TOP+P(680,700), {w:CW, in:47.2, out:49.3});

// ========== S6 49.5– ==========
head(V?['Don’t just teach','students','<i>about AI.</i>']:['Don’t just teach students', '<i>about AI.</i>'], ML, P(380,700), P(130,112), 49.75, 52.35, {st:.25});
head(V?['Give them','the opportunity','<i>to build it.</i>']:['Give them the opportunity', '<i>to build it.</i>'], ML, P(380,700), P(130,112), 52.75, 55.25, {st:.25});
// end card
add(`<span class="sc">A two-day, hands-on AI workshop for universities & business schools</span>`, ML, P(250,420), {w:CW, in:55.5});
head(['Shipping AI', '<i>That Works.</i>'], ML, P(300,480), P(176,160), 55.6, 1e9, {st:.25});
add('', ML, P(700,880), {cls:'rule', w:CW, fx:'draw', in:56.2, dur:1.6});
add(`<div class="s" style="font-size:${P(40,42)}px">From learning AI <i>to building AI.</i></div>`, ML, P(730,910), {w:CW, in:56.5});
const cta=add(`<div class="s" style="font-size:${P(52,50)}px;font-weight:400">Bring the workshop to your university →</div><div class="ul" style="height:2px;background:var(--ox);margin-top:6px;transform-origin:0 50%"></div>`, ML, P(810,1020), {in:57.0});
add(`<div class="sc" style="font-size:13px">Led by</div><div class="s" style="font-size:${P(34,36)}px;margin-top:6px">Otman Kettani</div>`, P(1440,ML), P(810,1180), {in:57.4, style:V?'':'text-align:right;right:'+ML+'px;left:auto'});
add(`<span class="m" style="font-size:12px;color:var(--mute)">Independent workshop · not affiliated with or endorsed by Uber</span>`, ML, P(1010,1770), {in:57.8, fx:'fade', style:V?'':'bottom:auto'});

st.insertAdjacentHTML('beforeend',grain);
window.render=function(t){
  // ink panel for S3 (rises from the bottom, then drops away)
  const up=eio(seg(t,20.35,21.05)), dn=eio(seg(t,31.35,32.0)); ink.style.transform=`scaleY(${up*(1-dn)})`;
  const dark=up*(1-dn)>.5; fr.style.filter=dark?'invert(1) hue-rotate(180deg) brightness(1.15)':'';
  for(const o of els) apply(o,t);
  let k=0; for(let i=0;i<SEC.length;i++) if(t>=SEC[i][0]) k=i; runR.textContent=SEC[k][1]; foot.textContent=SEC[k][2];
  prog.style.width=(clamp(t/58.5)*(W-2*ML))+'px';
  const endFrame=t>55.3; [runR,foot,prog].forEach(e=>e.style.opacity=endFrame?1-seg(t,55.3,55.9):1);
  stepEls.forEach((e,i)=>{ const on=t>=ST[i]&&t<SE[i], done=t>=SE[i]; e.style.color=on?'var(--ink)':(done?'rgba(20,33,61,.45)':'rgba(20,33,61,.3)'); e.querySelector('.s').style.fontStyle=on?'italic':'normal'; e.querySelector('.s').style.color=on?'var(--ox)':''; });
  document.querySelectorAll('[data-k]').forEach(e=>{ e.style.opacity=t>=+e.dataset.k?1:.2; });
  document.querySelectorAll('.ld').forEach(e=>{ const i=+e.dataset.i; e.style.opacity=t>=40.4+i*.22?1:.15; });
  const ul=cta.querySelector('.ul'); ul.style.transform=`scaleX(${eo(seg(t,57.4,58.6))})`;
  // slow camera drift
  ov.style.transform=`scale(${1+.012*Math.sin(t*.11)})`;
};
document.fonts.ready.then(()=>{ window.render(0); window.done=true; });
</script></body></html>
