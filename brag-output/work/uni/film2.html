const eo=x=>x>=1?1:1-Math.pow(2,-10*x), ei=x=>x*x*x, eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const bo=x=>{ if(x<=0) return 0; if(x>=1) return 1; const c1=1.4,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };

function add(html,x,y,o={}){ const d=document.createElement('div'); d.className='a '+(o.cls||''); d.innerHTML=html; d.style.left=x+'px'; d.style.top=y+'px';
  if(o.w) d.style.width=o.w+'px'; if(o.h) d.style.height=o.h+'px'; if(o.style) d.style.cssText+=';'+o.style; (o.parent||ov).appendChild(d);
  if(o.in!==undefined) els.push({el:d,in:o.in,out:o.out??1e9,fx:o.fx||'focus',dur:o.dur||.6,odur:o.odur||.35,dy:o.dy??24,base:o.base||'',rot:o.rot||0}); return d; }
function applyEl(o,t){ const pi=seg(t,o.in,o.in+o.dur), po=seg(t,o.out,o.out+o.odur); let op,tr='',f='';
  if(o.fx==='focus'){ const e=eo(pi); op=clamp(pi*2.5)*(1-ei(po)); f=`blur(${(1-e)*18+ei(po)*16}px)`; tr=`translateY(${(1-e)*o.dy}px) scale(${1+.04*(1-e)+.03*ei(po)})`; }
  else if(o.fx==='pop'){ const s=bo(pi); op=clamp(pi*4)*(1-ei(po)); tr=`scale(${.85+.15*s}) rotate(${o.rot*(1-s)}deg)`; f=po>0?`blur(${ei(po)*14}px)`:''; }
  else if(o.fx==='fade'){ op=eo(pi)*(1-ei(po)); }
  else if(o.fx==='slide'){ const e=eo(pi); op=clamp(pi*3)*(1-ei(po)); tr=`translateX(${(1-e)*80}px)`; f=`blur(${(1-e)*8+ei(po)*14}px)`; }
  o.el.style.opacity=op; o.el.style.transform=o.base+' '+tr; o.el.style.filter=f; o.el.style.visibility=op<=.002?'hidden':'visible'; }
function hl(html,x,y,size,w,tin,tout,o={}){ // word-by-word focus reveal; words wrapped by space; <g>..</g> marks gradient words
  const d=document.createElement('div'); d.className='a '+(o.cls||'h'); d.style.cssText=`left:${x}px;top:${y}px;font-size:${size}px;width:${w}px;${o.style||''}`;
  const parts=html.split(' '); const ws=[]; let grad=false;
  parts.forEach((p,i)=>{ if(p.startsWith('<g>')){grad=true;p=p.slice(3);} let end=false; if(p.endsWith('</g>')){end=true;p=p.slice(0,-4);}
    const s=document.createElement('span'); s.style.display='inline-block'; s.textContent=p; if(grad) s.className=o.gc||'grad'; if(p==='<br>'){ d.appendChild(document.createElement('br')); } else { d.appendChild(s); ws.push(s); if(i<parts.length-1) d.appendChild(document.createTextNode(' ')); }
    if(end) grad=false; });
  ov.appendChild(d); const h={el:d,ws,tin,tout,st:o.st??.06}; hls.push(h); return h; }
function applyHl(h,t){ let any=false; h.ws.forEach((s,i)=>{ const pi=eo(seg(t,h.tin+i*h.st,h.tin+i*h.st+.55)), po=ei(seg(t,h.tout,h.tout+.3));
  s.style.opacity=clamp(pi*2)*(1-po); s.style.filter=`blur(${(1-pi)*14+po*14}px)`; s.style.transform=`translateY(${(1-pi)*.25}em)`; if(pi>0&&po<1) any=true; }); h.el.style.visibility=any?'visible':'hidden'; }
const star=(s,c='#fff')=>`<svg width="${s}" height="${s}" viewBox="-50 -50 100 100"><g fill="${c}"><rect x="-27" y="-27" width="54" height="54"/><rect x="-27" y="-27" width="54" height="54" transform="rotate(45)"/></g></svg>`;

{ // abstract lecture hall: perspective rows of seats + board
