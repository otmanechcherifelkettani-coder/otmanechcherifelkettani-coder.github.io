<title>SoukGo agent console</title>
<style>
body{width:1920px;height:1080px;position:relative;background:var(--paper)}
.ui{position:absolute;left:160px;top:110px;width:1600px;height:860px;background:#fff;border-radius:32px;box-shadow:0 40px 100px rgba(17,32,74,.16);overflow:hidden}
.top{height:84px;display:flex;align-items:center;gap:16px;padding:0 32px;border-bottom:2px solid #efe7d6}
.dot{width:40px;height:40px;border-radius:12px;background:var(--orange);display:flex;align-items:center;justify-content:center;color:#fff;font-family:Brico;font-weight:800;font-size:20px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;font-family:JBM;font-weight:600;font-size:16px}
.chat{position:absolute;left:0;top:84px;width:44%;bottom:0;background:#FFFCF6;border-right:2px solid #efe7d6}
.msg{position:absolute;max-width:560px;padding:18px 22px;border-radius:24px;font-size:24px;line-height:1.35;transform-origin:bottom left}
.u{right:26px;background:var(--navy);color:#fff;border-bottom-right-radius:6px;transform-origin:bottom right}
.ag{left:26px;background:#EEF3FF;color:var(--navy);border-bottom-left-radius:6px}
.trace{position:absolute;left:44%;top:84px;right:0;bottom:0}
.step{position:absolute;left:28px;right:28px;height:84px;display:flex;align-items:center;gap:18px;border-bottom:2px solid #f2ecdf}
.n{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:JBM;font-weight:600;font-size:17px;color:#fff;flex:none}
.c{font-family:JBM;font-weight:600;font-size:19px;color:var(--navy)}
.r{font-family:JBM;font-size:16px;color:#6a7390;margin-top:4px}
.st{margin-left:auto}
.typing{position:absolute;left:26px;display:flex;gap:8px;background:#EEF3FF;padding:20px 22px;border-radius:24px;border-bottom-left-radius:6px}
.typing i{width:12px;height:12px;border-radius:50%;background:#8a93ad;display:block}
.btn{border-radius:999px;padding:12px 22px;font-size:19px;font-weight:700}
</style>
<body><div class="ui" id="ui">
 <div class="top"><span class="dot">S</span><b style="font-family:Brico;font-size:28px;color:var(--navy)">SoukGo Support</b><span class="mono" style="font-size:14px;color:#6a7390">Agent sandbox · team 3</span>
  <span class="pill" id="spin" style="margin-left:auto;background:#FFF1E9;color:var(--orange)">✦ working</span><span class="pill" style="background:#EEF3FF;color:var(--blue)">v0.1 · policy v1.0</span></div>
 <div class="chat" id="chat"><div class="mono" style="position:absolute;left:26px;bottom:24px;font-size:13px;color:#6a7390">Customer · French · authenticated · fictional data</div></div>
 <div class="trace" id="trace"><div class="mono" style="position:absolute;left:28px;top:22px;font-size:14px;color:#6a7390">Agent trace</div>
  <div style="position:absolute;left:28px;right:28px;bottom:24px;display:flex;gap:10px;flex-wrap:wrap" id="guard"><span class="pill" style="background:#F2F0EA;color:var(--navy)">identity: server-side</span><span class="pill" style="background:#F2F0EA;color:var(--navy)">amount: policy engine</span><span class="pill" style="background:#F2F0EA;color:var(--navy)">money: ledger</span></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>clamp((t-a)/(b-a));
const bo=x=>{ if(x<=0) return 0; if(x>=1) return 1; const c1=1.7,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };
const items=[];
function el(parent,html,t0,t1=99){ const d=document.createElement('div'); d.innerHTML=html; const e=d.firstElementChild; parent.appendChild(e); items.push({e,t0,t1}); return e; }
// chat
el($('chat'),'<div class="msg u" style="top:30px">Bonjour, il manque ma boisson dans ma commande SG-1001.</div>',.3,4.5);
const ty1=el($('chat'),'<div class="typing" style="top:170px"><i></i><i></i><i></i></div>',.9,2.4);
el($('chat'),'<div class="msg ag" style="top:170px">Désolé ! Votre boisson (20 MAD) est éligible au remboursement. Je confirme ?</div>',2.4,4.5);
const conf=el($('chat'),'<div style="position:absolute;left:26px;top:310px;display:flex;gap:12px"><span class="btn" id="cbtn" style="background:var(--orange);color:#fff">Confirmer</span><span class="btn" style="background:#fff;border:2px solid #d9d0bd;color:var(--navy)">Parler à un humain</span></div>',2.7,4.5);
el($('chat'),'<div class="msg ag" style="top:400px;background:#E6FAF3">C\'est fait : remboursement de 20 MAD confirmé par notre système.</div>',3.75,4.5);
el($('chat'),'<div class="msg u" style="top:30px">Et le sandwich ? Il était froid, je veux aussi un remboursement.</div>',4.8,99);
const ty2=el($('chat'),'<div class="typing" style="top:170px"><i></i><i></i><i></i></div>',5.3,6.6);
el($('chat'),'<div class="msg ag" style="top:170px">Je ne peux pas valider ce cas automatiquement. Je le transmets à un conseiller, avec votre dossier.</div>',6.6,99);
el($('chat'),'<div class="pill" style="position:absolute;left:26px;top:320px;background:#FFF1E9;color:var(--orange);font-size:17px">Case H-0142 · handed to a human</div>',7.0,99);
// trace
const S=[[ '1','var(--navy)','request.received','intent: missing_item · lang: fr','✓',.5,4.5],
 ['2','var(--blue)','get_order("SG-1001")','delivered · card · 2 items','✓',1.0,4.5],
 ['3','#13865f','check_refund_eligibility(I-2)','ELIGIBLE · MAD 20 · proposal p-7','✓',1.5,4.5],
 ['4','var(--orange)','submit_refund(p-7)','confirmed by customer → ledger','SUCCEEDED',3.2,4.5],
 ['1','var(--navy)','request.received','intent: quality_complaint · item I-1','✓',5.0,99],
 ['2','#13865f','check_refund_eligibility(I-1)','quality claim · outside auto-refund policy','NEEDS_HUMAN',5.6,99],
 ['3','var(--orange)','escalate_case(SG-1001)','reason: NEEDS_HUMAN · no money moved','CASE H-0142',6.2,99]];
const rows=S.map((s,i)=>{ const k=i<4?i:i-4; const col=s[4]==='✓'?['#E6FAF3','#13865f']:(s[4]==='SUCCEEDED'?['#13865f','#fff']:(s[4]==='NEEDS_HUMAN'?['#FFF1E9','var(--orange)']:['var(--orange)','#fff']));
  return el($('trace'),`<div class="step" style="top:${64+k*92}px"><span class="n" style="background:${s[1]}">${s[0]}</span><div><div class="c">${s[2]}</div><div class="r">${s[3]}</div></div><span class="st pill" style="background:${col[0]};color:${col[1]}">${s[4]}</span></div>`,s[5],s[6]); });
window.render=function(t){
  for(const it of items){ const p=bo(seg(t,it.t0,it.t0+.35)), o=seg(t,it.t1,it.t1+.2); const on=t>=it.t0&&t<it.t1+.2;
    it.e.style.display=on?'':'none'; it.e.style.opacity=clamp(p*3)*(1-o); it.e.style.transform=`translateY(${(1-p)*18}px) scale(${.94+.06*p})`; }
  [ty1,ty2].forEach(ty=>[...ty.children].forEach((d,i)=>d.style.transform=`translateY(${-6*Math.max(0,Math.sin(t*9-i*.9))}px)`));
  const b=document.getElementById('cbtn'); if(b){ const pr=seg(t,3.45,3.55)-seg(t,3.55,3.7); b.style.transform=`scale(${1-.08*pr})`; b.style.filter=t>3.55&&t<4.5?'brightness(.9)':''; }
  const busy=(t>.5&&t<2.4)||(t>3.2&&t<3.75)||(t>5.0&&t<6.6); $('spin').style.opacity=busy?1:.25; $('spin').textContent=busy?'✦ working':'✦ idle';
  // loop seam: fade the whole UI content at the end
  $('ui').style.opacity=1-seg(t,7.75,8.0)*.0;
};
window.render(0); window.done=true;
</script></body>
