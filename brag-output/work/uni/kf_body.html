<style>

<body><canvas id="c" class="a" style="left:0;top:0"></canvas><div id="ov" class="a" style="left:0;top:0;right:0;bottom:0"></div>

const frameTag=(n,label,dark)=>mono(`KF ${n} · ${label}`, V?60:80, V?60:56, dark?'color:rgba(255,255,255,.7)':'');

    const h=((i*7+j*13)%17); col.set(h<2?C.orange:(h<6?C.yellow:(h<9?C.mint:0xdfe7ff))); inst.setColorAt(k,col); k++; }

if(K===7){ // DELIVERABLES

      const m=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.18,bevelEnabled:true,bevelSize:.05,bevelThickness:.05,bevelSegments:4}),new THREE.MeshStandardMaterial({color:C.orange,roughness:.4})); m.castShadow=true; add(m,x,top+.75,-.1,1,0,-.2); }
