<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"color-ground","type":"color","label":"Background","default":"#f5f2eb"},
  {"id":"color-ink","type":"color","label":"Text","default":"#10211b"},
  {"id":"color-accent","type":"color","label":"Accent","default":"#0f6b46"},
  {"id":"color-mint","type":"color","label":"Mint","default":"#6fd39f"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #f5f2eb;
        --color-ink: #10211b;
        --color-accent: #0f6b46;
        --color-mint: #6fd39f;
        --sand: #e8e4d9;
        --muted: #5d6b65;
        --danger: #d9534f;
        --font-display: "Inter";
        --font-mono: "IBM Plex Mono";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground); }
      #root { width: 100%; height: 100%; font-family: var(--font-display); color: var(--color-ink); }
      #ground { position: absolute; inset: 0; background: var(--color-ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1920" data-height="1080">
      <div id="ground"></div>

      <div id="demo" data-composition-id="demo" data-composition-src="compositions/demo.html" data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
